<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Cálculo Multivariado</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    model-viewer {
      width: 100%;
      height: 80vh;
      background-color: #000;
    }

    .controls {
      margin: 15px 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      background: linear-gradient(135deg, #6c5ce7, #8e7bff);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    .info {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2 id="modelName">Campo Vectorial: Torre</h2>

  <!-- Visor del modelo -->
  <model-viewer id="viewer"
                src="modelados/torre.glb"
                alt="Campo vectorial 1"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                auto-rotate
                shadow-intensity="1"
                camera-target="auto"
                camera-orbit="0deg 75deg 2m">
  </model-viewer>

  <!-- Controles -->
  <div class="controls">
    <button id="toggleBtn">Cambiar modelo</button>
  </div>

  <div class="info">
    🌐 Arrastra para rotar el modelo.<br>
    📱 En celular toca “Ver en tu espacio” para activar la cámara AR.
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const btn = document.getElementById('toggleBtn');
    const modelName = document.getElementById('modelName');
    let mode = 1;

    btn.addEventListener('click', () => {
      if (mode === 1) {
        viewer.src = 'modelados/campo.glb';
        modelName.textContent = 'Campo Vectorial';
        mode = 2;
      } else if (mode === 2) {
        viewer.src = 'modelados/ambos.glb';
        modelName.textContent = 'Comparación';
        mode = 3;
      } else {
        viewer.src = 'modelados/torre.glb';
        modelName.textContent = 'Torre';
        mode = 1;
      }
    });
  </script>

</body>
</html>
